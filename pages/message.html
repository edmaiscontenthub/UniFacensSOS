<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFacens SOS – Sistema Emergencial do Campus</title>
    <link rel="stylesheet" href="../styles/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Reddit+Sans+Condensed:wght@200..900&display=swap" rel="stylesheet">
</head>
<body data-page="message">
    <div class="container">
        <header>
            <a href="home.html" class="back">
                <img src="../assets/images/return.svg" alt="">
            </a>
            <div class="logo">
                <img src="../assets/images/unifacens-logo.svg" alt="">
            </div>
            <div class="title">
                <img src="../assets/images/sos.svg" alt="">
                <h1>SOS</h1>
            </div>
        </header>
        <main>
            <p>Selecione o tipo de ocorrência.</p>

            <div class="grid">
                <a class="btn" id="first-aid" href="#" onclick="definirTipo('PRIMEIROS SOCORROS'); iniciarLocalizacao(); return false;">
                    <div class="btn-image">
                        <img id="normal" src="../assets/images/first-aid.svg" alt="">
                        <img id="hover" src="../assets/images/first-aid-hover.svg" alt="">
                    </div>
                    <span>Primeiros Socorros</span>
                </a>
        
                <a class="btn" id="fire" href="#" onclick="definirTipo('INCÊNDIO'); iniciarLocalizacao(); return false;">
                    <div class="btn-image">
                        <img id="normal" src="../assets/images/fire.svg" alt="">
                        <img id="hover" src="../assets/images/fire-hover.svg" alt="">
                    </div>
                    <span>Incêndio</span>
                </a>
        
                <a class="btn" id="risk" href="#" onclick="definirTipo('RISCO'); iniciarLocalizacao(); return false;">
                    <div class="btn-image">
                        <img id="normal" src="../assets/images/risk.svg" alt="">
                        <img id="hover" src="../assets/images/risk-hover.svg" alt="">
                    </div>
                    <span>Risco</span>
                </a>
    
                <a class="btn" id="other" href="#" onclick="definirTipo('OUTROS'); iniciarLocalizacao(); return false;">
                    <div class="btn-image">
                        <img id="normal" src="../assets/images/other.svg" alt="">
                        <img id="hover" src="../assets/images/other-hover.svg" alt="">
                    </div>
                    <span>Outros</span>
                </a>
            </div>
    
            <p>Sistema de resposta rápida institucional</p>     
        </main>
        <footer>
            <p>&lt;/ Developed by ED+ Content Hub &gt;</p>
        </footer>
    </div>

    <!-- Overlay / Lightbox -->
    <div id="lightbox" class="lb is-hidden" aria-live="polite" aria-busy="false">
        <div class="lb__card" role="dialog" aria-modal="true" aria-labelledby="lbTitle">

            <!-- Cabeçalho (fixo no HTML) -->
            <div class="lb__header">
                <div class="lb__spinner" aria-hidden="true"></div>
                <div class="lb__titles">
                    <div id="lbTitle" class="lb__title">ATIVE A LOCALIZAÇÃO!</div>
                    <div id="lbSubtitle" class="lb__subtitle">Ative o GPS e permita o acesso, se solicitado.</div>
                </div>
            </div>

            <!-- Conteúdo (JS só preenche spans) -->
            <div class="lb__body">
                <div class="lb__row">
                    <span class="lb__label">Precisão atual</span>
                    <span id="lbAccuracy" class="lb__value">—</span>
                </div>

                <div class="lb__row">
                    <span class="lb__label">Meta</span>
                    <span id="lbTarget" class="lb__value">—</span>
                </div>

                <div id="lbHint" class="lb__hint">
                    Isso pode levar alguns segundos.
                </div>
            </div>

            <!-- Ações -->
            <div class="lb__actions">
                <button id="btnForcar" class="btn btn--danger is-hidden" type="button">
                    Enviar sem localização
                </button>
            </div>

        </div>
    </div>

    <script type="module" src="../scripts/app.js"></script>
</body>
</html>
