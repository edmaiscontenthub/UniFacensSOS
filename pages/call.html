<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon-180.png">
    <title>UniFacens SOS – Sistema Emergencial do Campus</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/utils.css">
    <link rel="stylesheet" href="../styles/call.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Reddit+Sans+Condensed:wght@200..900&display=swap" rel="stylesheet">
</head>
<body data-page="call">
    <div class="container">
        <header>
            <a href="home.html" class="back">
                <img src="../assets/images/return.svg" alt="">
            </a>
            <div class="logo">
                <img src="../assets/images/unifacens-logo.svg" alt="">
            </div>
            <div class="title">
                <img src="../assets/images/sos.svg" alt="">
                <h1>UniFacens SOS</h1>
            </div>
        </header>
        <main>
            <p>Selecione o contato telefônico.</p>

            <div class="grid">
                <a class="btn is-hidden" id="gatehouse" data-contact-sector="PORTARIA">
                    <div class="btn-image">
                        <img id="normal" src="../assets/images/gatehouse.svg" alt="">
                        <img id="hover" src="../assets/images/gatehouse-hover.svg" alt="">
                    </div>
                    <span>Portaria</span>
                </a>
        
                <a class="btn is-hidden" id="clinic" data-contact-sector="AMBULATÓRIO">
                    <div class="btn-image">
                        <img id="normal" src="../assets/images/clinic.svg" alt="">
                        <img id="hover" src="../assets/images/clinic-hover.svg" alt="">
                    </div>
                    <span>Ambulatório</span>
                </a>
        
                <a class="btn is-hidden" id="occupational-safety" data-contact-sector="SEGURANÇA DO TRABALHO">
                    <div class="btn-image">
                        <img id="normal" src="../assets/images/occupational-safety.svg" alt="">
                        <img id="hover" src="../assets/images/occupational-safety-hover.svg" alt="">
                    </div>
                    <span>Segurança do Trabalho</span>
                </a>
            </div>

            <p>Sistema de resposta rápida institucional</p>
        </main>
        <footer>
            <p>&lt;/ Developed by ED+ Content Hub &gt;</p>
            <p>&copy; 2026 UniFacens. Todos os direitos reservados.</p>
        </footer>
    </div>
    <script type="module" src="../scripts/app.js"></script>
</body>
</html>
